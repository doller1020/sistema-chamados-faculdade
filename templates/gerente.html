<!DOCTYPE html>
<html>

<head>
    <title>Gerente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="topo">

        <div class="logo">
            Help Desk
        </div>

        <div class="usuario-menu">

            <button class="usuario-btn" onclick="toggleMenu()">
                👤 {{ session["usuario"] }}
            </button>

            <div id="menuUsuario" class="dropdown">

                <a href="/alterar_senha">
                    🔒 Alterar Senha
                </a>

                <a href="/logout">
                    🚪 Sair da Sessão
                </a>

            </div>

        </div>

    </div>

    <div class="card">

        <h1>Chamados Finalizados</h1>

        <table>

            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Usuário</th>
                <th>Técnico</th>
                <th>Finalizado em</th>
            </tr>

            {% for c in chamados %}
            <tr>
                <td>{{ c["id"] }}</td>
                <td>{{ c["titulo"] or "" }}</td>
                <td>{{ c["usuario"] or "" }}</td>
                <td>{{ c["tecnico_responsavel"] or "" }}</td>
                <td>{{ c["data_finalizacao"] or "" }}</td>
            </tr>
            {% endfor %}

        </table>

    </div>

    <script>

        function toggleMenu() {
            document.getElementById("menuUsuario").classList.toggle("show");
        }

        window.addEventListener("pageshow", function(event) {

            if (event.persisted) {
                window.location.reload();
            }

        });

    </script>

</body>

</html>
