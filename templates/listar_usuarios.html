<!DOCTYPE html>
<html>

<head>
    <title>Usuários Cadastrados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="topo">

        <div class="logo">
            Help Desk
        </div>

        <div class="usuario-menu">

            <button class="usuario-btn" onclick="toggleMenu()">
                👤 {{ session["usuario"] }}
            </button>

            <div id="menuUsuario" class="dropdown">

                <a href="/alterar_senha">
                    🔒 Alterar Senha
                </a>

                <a href="/logout">
                    🚪 Sair da Sessão
                </a>

            </div>

        </div>

    </div>

    <button onclick="history.back()">Voltar</button>

    <div class="card">

        <h2>Usuários cadastrados</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Login</th>
                <th>Tipo</th>
                <th>Ação</th>
            </tr>

            {% for usuario in usuarios %}
            <tr>

                <td>{{ usuario["id"] }}</td>
                <td>{{ usuario["login"] }}</td>
                <td>{{ usuario["tipo"] }}</td>

                <td>
                    <form action="/deletar_usuario/{{ usuario['id'] }}" method="POST">
                        <button type="submit">Excluir</button>
                    </form>
                </td>

            </tr>
            {% endfor %}

        </table>

    </div>

    <script>

        function toggleMenu() {
            document.getElementById("menuUsuario").classList.toggle("show");
        }

        window.addEventListener("pageshow", function(event) {

            if (event.persisted) {
                window.location.reload();
            }

        });

    </script>

</body>

</html>
