<!DOCTYPE html>
<html>

<head>
    <title>Resolver Chamado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="topo">

        <div class="logo">
            Help Desk
        </div>

        <div class="usuario-menu">

            <button class="usuario-btn" onclick="toggleMenu()">
                👤 {{ session["usuario"] }}
            </button>

            <div id="menuUsuario" class="dropdown">

                <a href="/alterar_senha">
                    🔒 Alterar Senha
                </a>

                <a href="/logout">
                    🚪 Sair da Sessão
                </a>

            </div>

        </div>

    </div>

    <a href="/chamados">
        <button>Voltar</button>
    </a>

    <div class="card">

        <h2>Resolver Chamado #{{ chamado["id"] }}</h2>

        <p><b>Título:</b> {{ chamado["titulo"] or "" }}</p>

        <p><b>Descrição:</b> {{ chamado["descricao"] or "" }}</p>

        <form method="POST">

            <textarea
                name="resposta"
                rows="6"
                placeholder="Digite a solução"></textarea>

            <br><br>

            <button formaction="/finalizar/{{ chamado['id'] }}">
                Finalizar Chamado
            </button>

            {% if session["tipo"] != "tecnico_n3" %}

            <button formaction="/encaminhar/{{ chamado['id'] }}">
                Encaminhar Próximo Nível
            </button>

            {% endif %}

        </form>

    </div>

    <script>

        function toggleMenu() {
            document.getElementById("menuUsuario").classList.toggle("show");
        }

        window.addEventListener("pageshow", function(event) {

            if (event.persisted) {
                window.location.reload();
            }

        });

    </script>

</body>

</html>
