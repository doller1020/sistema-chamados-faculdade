<!DOCTYPE html>
<html>

<head>
    <title>Painel Técnico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="topo">

        <div class="logo">
            Help Desk
        </div>

        <div class="usuario-menu">

            <button class="usuario-btn" onclick="toggleMenu()">
                👤 {{ session["usuario"] }}
            </button>

            <div id="menuUsuario" class="dropdown">

                <a href="/alterar_senha">
                    🔒 Alterar Senha
                </a>

                <a href="/logout">
                    🚪 Sair da Sessão
                </a>

            </div>

        </div>

    </div>

    <button onclick="history.back()">Voltar</button>

    <div class="card">

        <h1>Painel do Técnico</h1>

        <a href="/chamados">
            <button>Ver Chamados</button>
        </a>

    </div>

    <script>

        function toggleMenu() {
            document.getElementById("menuUsuario").classList.toggle("show");
        }

        window.addEventListener("pageshow", function(event) {

            if (event.persisted) {
                window.location.reload();
            }

        });

    </script>

</body>

</html>
