<!DOCTYPE html>
<html>

<head>
    <title>Usuários do Sistema</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="topo">

        <div class="logo">
            Help Desk
        </div>

        <div class="usuario-menu">

            <button class="usuario-btn" onclick="toggleMenu()">
                👤 {{ session["usuario"] }}
            </button>

            <div id="menuUsuario" class="dropdown">

                <a href="/alterar_senha">
                    🔒 Alterar Senha
                </a>

                <a href="/logout">
                    🚪 Sair da Sessão
                </a>

            </div>

        </div>

    </div>

    <a href="/admin">
        <button>Voltar</button>
    </a>

    <div class="card">

        <h2>Usuários do Sistema</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Login</th>
                <th>Tipo</th>
                <th>Ações</th>
            </tr>

            {% for u in usuarios %}
            <tr>

                <td>{{ u["id"] }}</td>
                <td>{{ u["login"] }}</td>
                <td>{{ u["tipo"] }}</td>

                <td>

                    <a href="/editar_usuario/{{ u['id'] }}">
                        <button>Editar</button>
                    </a>

                    <a href="/excluir_usuario/{{ u['id'] }}">
                        <button>Excluir</button>
                    </a>

                </td>

            </tr>
            {% endfor %}

        </table>

    </div>

    <script>

        function toggleMenu() {
            document.getElementById("menuUsuario").classList.toggle("show");
        }

        document.addEventListener("click", function(event) {

            const menu = document.getElementById("menuUsuario");
            const botao = document.querySelector(".usuario-btn");

            if (
                !menu.contains(event.target) &&
                !botao.contains(event.target)
            ) {
                menu.classList.remove("show");
            }

        });

        window.addEventListener("pageshow", function(event) {

            if (event.persisted) {
                window.location.reload();
            }

        });

    </script>

</body>

</html>
